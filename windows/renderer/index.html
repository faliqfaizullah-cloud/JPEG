<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https: http:; media-src 'self' file: blob: https: http:; connect-src 'self' file: https: http:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPEG</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="g-default">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="bg"></div>
<main id="view"></main>
<div id="fadeTop"></div><div id="fadeBot"></div>
<header id="topbar"></header>
<div id="dock"><div id="mini"></div><nav id="tabs"></nav></div>
<section id="sheet" class="sheet"></section>
<section id="settings" class="sheet"></section>
<section id="lyrics"></section>
<div id="modal"></div>
<div id="toast"></div>
<script src="lib/lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
